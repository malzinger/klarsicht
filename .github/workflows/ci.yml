name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint · Typecheck · Test · Build · Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: klarsicht-extension
          path: klarsicht-extension.zip
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy landing page to GitHub Pages
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Attach extension zip to the release
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: klarsicht-extension
      - uses: softprops/action-gh-release@v2
        with:
          files: klarsicht-extension.zip
          generate_release_notes: true
