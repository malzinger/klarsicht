name: Accessibility gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: Klarsicht scan of the pull request build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Serve the build
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done

      - name: Scan the landing page
        uses: ./
        with:
          url: http://localhost:4173/
          threshold: 90
