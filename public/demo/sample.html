<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <style>
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #17171a;
        background: #fff;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 24px;
        border-bottom: 1px solid #eee;
      }
      .logo {
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .search {
        display: flex;
        margin-left: auto;
      }
      .search input {
        padding: 8px 10px;
        border: 1px solid #ddd;
        border-radius: 8px 0 0 8px;
      }
      .icon-btn {
        width: 36px;
        border: 1px solid #ddd;
        border-left: 0;
        border-radius: 0 8px 8px 0;
        background: #f6f6f6;
      }
      .cart {
        display: inline-flex;
        padding: 6px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: center;
        padding: 32px 24px;
      }
      .hero img {
        width: 100%;
        border-radius: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }
      .muted {
        color: #9d9d9d;
      }
      .price {
        font-size: 22px;
        font-weight: 700;
      }
      .price s {
        color: #bdbdbd;
        font-weight: 400;
        margin-right: 8px;
      }
      .cta {
        margin-top: 16px;
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        background: #17171a;
        color: #fff;
        font-weight: 600;
      }
      .tiny {
        display: inline-block;
        margin-left: 12px;
        font-size: 11px;
        color: #4b7bec;
        text-decoration: none;
      }
      h4 {
        margin: 24px 24px 8px;
      }
      .swatches {
        display: flex;
        gap: 10px;
        padding: 0 24px;
      }
      .swatch {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid #ccc;
        padding: 0;
      }
      form {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 32px 24px;
        padding: 20px;
        background: #f4f2ee;
        border-radius: 12px;
      }
      form input,
      form select {
        padding: 8px 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        padding: 24px;
        border-top: 1px solid #eee;
        font-size: 13px;
      }
      .footer a {
        color: #17171a;
        text-decoration: none;
      }
      .badge {
        color: #a6a6a6;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <span class="logo">Nimbus Audio</span>
      <div class="search">
        <input type="search" placeholder="Search" />
        <button class="icon-btn" tabindex="3">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
        </button>
      </div>
      <a class="cart" href="#cart">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L21 8H7" />
          <circle cx="10" cy="20" r="1" />
          <circle cx="18" cy="20" r="1" />
        </svg>
      </a>
    </div>

    <div class="hero">
      <img
        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='320'><rect width='480' height='320' rx='24' fill='%23e7e4de'/><path d='M120 200 Q240 40 360 200' stroke='%232c2f34' stroke-width='22' fill='none' stroke-linecap='round'/><rect x='84' y='180' width='72' height='96' rx='30' fill='%232c2f34'/><rect x='324' y='180' width='72' height='96' rx='30' fill='%232c2f34'/></svg>"
      />
      <div>
        <h1>Nimbus One</h1>
        <p class="muted">
          Wireless over-ear headphones with 40 hours of battery, adaptive noise cancelling and a
          laser engraving of your choice.
        </p>
        <p class="price"><s>€349</s>€299</p>
        <button class="cta">Buy now</button>
        <a class="tiny" href="#compare">compare</a>
      </div>
    </div>

    <h4>Colours</h4>
    <div class="swatches">
      <button class="swatch" style="background: #2c2f34"></button>
      <button class="swatch" style="background: #c9cdd3"></button>
      <button class="swatch" style="background: #1e2b4a"></button>
      <button class="swatch" style="background: #8a9c7e"></button>
    </div>

    <form>
      <span class="badge">Newsletter</span>
      <input type="email" placeholder="Email" />
      <select>
        <option>Weekly</option>
        <option>Monthly</option>
      </select>
      <button type="button" class="cta" style="margin: 0">Go</button>
    </form>

    <div class="footer">
      <a href="#imprint">Imprint</a>
      <span class="badge">© Nimbus Audio, a fictional brand</span>
    </div>
  </body>
</html>
